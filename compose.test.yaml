name: gofi-test
services:
  initialize:
    network_mode: none
    image: python:3.14.7-slim-bookworm@sha256:82bc3c539b8813ada9d68c63b40158fa002f7f33de9bf3312a3dfdc0620dff56
    user: "0:0"
    entrypoint: ["python", "/opt/testenv/seed.py"]
    volumes:
      - ./testenv/seed.py:/opt/testenv/seed.py:ro
      - ./testenv/listeners.yaml:/opt/testenv/listeners.yaml:ro
      - gofi-state:/data
      - received-events:/received
  gofi:
    image: ${GOFI_IMAGE:-ghcr.io/wcrum/gofi:0.2.0}
    pull_policy: never
    user: "0:0"
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      GOFI_DEPLOY_MODE: compose
      GOFI_DRIVER: docker
      GOFI_IMAGE: ${GOFI_IMAGE:-ghcr.io/wcrum/gofi:0.2.0}
      GOFI_DOCKER_NETWORK: gofi-test
      GOFI_CONFIG_FILE: /data/listeners.yaml
      XDG_CONFIG_HOME: /data/config
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gofi-state:/data
    networks: [applications]
  application:
    image: python:3.14.7-slim-bookworm@sha256:82bc3c539b8813ada9d68c63b40158fa002f7f33de9bf3312a3dfdc0620dff56
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-B", "/opt/testenv/application.py"]
    environment:
      ROLE: sender
      SOURCE_HOST: gofi-listener-real-events
      SOURCE_PORT: "17000"
    ports: ["127.0.0.1:19080:8080"]
    volumes:
      - ./testenv/application.py:/opt/testenv/application.py:ro
    networks: [applications]
  receiver:
    image: python:3.14.7-slim-bookworm@sha256:82bc3c539b8813ada9d68c63b40158fa002f7f33de9bf3312a3dfdc0620dff56
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      initialize:
        condition: service_completed_successfully
    entrypoint: ["python", "-B", "/opt/testenv/application.py"]
    environment:
      ROLE: receiver
      RECEIVED_FILE: /received/events.jsonl
    ports: ["127.0.0.1:19081:8080"]
    volumes:
      - ./testenv/application.py:/opt/testenv/application.py:ro
      - received-events:/received
    networks: [applications]
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:19094:9090"]
    volumes:
      - ./testenv/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [applications]

networks:
  applications:
    name: gofi-test
volumes:
  gofi-state:
  received-events:
  prometheus-data:
