services:
  gofi:
    image: ${GOFI_IMAGE:-ghcr.io/wcrum/gofi:0.2.0}
    build:
      context: .
    # The Docker driver manages sibling listeners through the host socket.
    user: "0:0"
    environment:
      GOFI_DEPLOY_MODE: compose
      GOFI_DRIVER: docker
      GOFI_IMAGE: ${GOFI_IMAGE:-ghcr.io/wcrum/gofi:0.2.0}
      GOFI_DOCKER_NETWORK: ${GOFI_DOCKER_NETWORK:-gofi}
      GOFI_CONFIG_FILE: /data/gofi.yaml
    ports:
      - "127.0.0.1:${GOFI_PORT:-9091}:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gofi-data:/data
    networks:
      - gofi

networks:
  gofi:
    name: ${GOFI_DOCKER_NETWORK:-gofi}

volumes:
  gofi-data:
