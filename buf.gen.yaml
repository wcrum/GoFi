version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: ui/node_modules/.bin/protoc-gen-es
    out: ui/src/gen
    # Explicit .ts specifiers let Node's test runner load cross-file imports.
    opt:
      - target=ts
      - import_extension=ts
