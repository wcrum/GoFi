<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/gofi-logo.svg" />
    <title>GoFi</title>
    <script>
      // Apply the stored or system theme before first paint (no flash).
      // Keep in sync with src/theme/ThemeProvider.tsx (key gofi.theme).
      (function () {
        var mode = 'dark'
        try {
          var stored = localStorage.getItem('gofi.theme')
          mode = stored === 'light' || stored === 'dark' ? stored
            : window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
