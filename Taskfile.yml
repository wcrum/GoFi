version: '3'

env:
  GOWORK: 'off'

vars:
  GOFI_IMAGE: '{{default "ghcr.io/wcrum/gofi:0.2.0" .GOFI_IMAGE}}'

tasks:
  default:
    desc: Run the gofi server (with embedded UI)
    cmds:
      - task: ui:build
      - go run .

  run:
    desc: Run the gofi server (skip UI rebuild)
    cmd: go run .

  build:
    desc: Build the gofi binary
    cmds:
      - task: ui:build
      - go build -o bin/gofi .

  test:
    desc: Run Go tests
    cmd: go test ./...

  docker:build:
    desc: Build the gofi Docker image
    cmd: docker build -t '{{.GOFI_IMAGE}}' .

  docker:up:
    desc: Build (if needed) and start gofi via Docker Compose
    env:
      GOFI_IMAGE: '{{.GOFI_IMAGE}}'
    cmd: docker compose up --build -d

  ui:dev:
    desc: Start the Vite dev server
    dir: ui
    cmd: npm run dev

  ui:build:
    desc: Build the UI for production embedding
    dir: ui
    cmd: npm run build

  ui:install:
    desc: Install UI dependencies
    dir: ui
    cmd: npm ci
