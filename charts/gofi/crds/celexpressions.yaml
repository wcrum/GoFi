apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: celexpressions.gofi.wcrum.dev
spec:
  group: gofi.wcrum.dev
  scope: Namespaced
  names:
    plural: celexpressions
    singular: celexpression
    kind: CelExpression
    listKind: CelExpressionList
    shortNames: [celx]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Result
          type: string
          jsonPath: .spec.resultType
        - name: Generation
          type: integer
          jsonPath: .spec.generation
        - name: Expression
          type: string
          jsonPath: .spec.expression
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [expression]
              properties:
                description:
                  type: string
                  maxLength: 1024
                expression:
                  type: string
                  minLength: 1
                  maxLength: 8192
                tags:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 64
                resultType:
                  type: string
                  enum: [bool, any]
                  default: bool
                # Managed by GoFi: incremented when expression text changes.
                # Listeners may pin a generation; pinned revisions are kept.
                generation:
                  type: integer
                  minimum: 0
                revisions:
                  type: array
                  items:
                    type: object
                    required: [generation, expression]
                    properties:
                      generation:
                        type: integer
                        minimum: 1
                      expression:
                        type: string
                        maxLength: 8192
