apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: listeners.gofi.wcrum.dev
spec:
  group: gofi.wcrum.dev
  scope: Namespaced
  names:
    plural: listeners
    singular: listener
    kind: Listener
    listKind: ListenerList
    shortNames: [gofilst]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Port
          type: integer
          jsonPath: .spec.source.port
        - name: Network
          type: string
          jsonPath: .spec.source.network
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [source, framing, parser]
              properties:
                source:
                  type: object
                  required: [port]
                  properties:
                    python: &pythonRef
                      type: object
                      required: [library, function]
                      properties:
                        library:
                          type: string
                          minLength: 1
                        function:
                          type: string
                          minLength: 1
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    network:
                      type: string
                      enum: [tcp, udp]
                    service:
                      type: object
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [ClusterIP, NodePort]
                        port:
                          type: integer
                          minimum: 0
                          maximum: 65535
                        nodePort:
                          type: integer
                          minimum: 0
                          maximum: 65535
                      x-kubernetes-validations:
                        - rule: "!has(self.nodePort) || self.nodePort == 0 || self.type == 'NodePort'"
                          message: nodePort requires type NodePort
                framing:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [line, delimited, length-prefix, raw, ""]
                    delimiter:
                      type: string
                    prefixLen:
                      type: integer
                      enum: [0, 2, 4]
                    maxBytes:
                      type: integer
                      minimum: 0
                parser:
                  type: object
                  properties:
                    python: *pythonRef
                    format:
                      type: string
                      enum: [json, xml, none, python, ""]
                    decoders:
                      type: array
                      items:
                        type: string
                        enum: [base64, base64url, hex, gzip, zlib, url]
                    maxDecodedBytes:
                      type: integer
                      minimum: 0
                    errorPolicy:
                      type: string
                      enum: [continue, drop, ""]
                stages:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      python: *pythonRef
                sinks:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      type:
                        type: string
                        enum: [stdout, http, tcp, udp, nats, aster, zenoh, loki, python, ""]
                      python: *pythonRef
                      kubernetes:
                        type: object
                        required: [selector, port]
                        properties:
                          namespace:
                            type: string
                          selector:
                            type: object
                            minProperties: 1
                            additionalProperties:
                              type: string
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                deadLetterSink:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                testCases:
                  type: array
                  items:
                    type: object
                    required: [id, name, raw]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      raw:
                        type: string
