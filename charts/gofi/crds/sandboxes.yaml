apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.gofi.wcrum.dev
spec:
  group: gofi.wcrum.dev
  scope: Namespaced
  names:
    plural: sandboxes
    singular: sandbox
    kind: Sandbox
    listKind: SandboxList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [sourceCode]
              properties:
                sourceCode:
                  type: string
                  minLength: 1
                  maxLength: 65536
                timeoutSeconds:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 5
                memoryMib:
                  type: integer
                  minimum: 64
                  maximum: 1024
                  default: 128
                managedBy:
                  description: Set by GoFi to flow:<listener> for libraries generated from inline flow stages.
                  type: string
                  maxLength: 260
                ai:
                  description: 'Deprecated and ignored: whether libraries may use the deployment''s AI endpoint through gofi.llm is one switch under Administration › AI assistant (the assistant configuration''s allowFunctions).'
                  type: boolean
                tests:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [function, kind]
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      function:
                        type: string
                        minLength: 1
                        maxLength: 128
                      kind:
                        type: string
                        enum: [listener, parser, transformer, sink]
                      raw:
                        description: Base64-encoded sample bytes.
                        type: string
                        format: byte
                      fields: &freeform
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      meta: *freeform
                      config: *freeform
                      expectFields: *freeform
                      expectDrop:
                        type: boolean
                egress:
                  description: Outbound destinations; empty denies all egress. Each rule becomes a NetworkPolicy egress rule.
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    properties:
                      cidr:
                        type: string
                      port:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      protocol:
                        type: string
                        enum: [tcp, udp, ""]
                      namespace:
                        type: string
                      podSelector:
                        type: object
                        additionalProperties:
                          type: string
                      description:
                        type: string
                        maxLength: 200
                    x-kubernetes-validations:
                      - rule: "has(self.cidr) || has(self.namespace) || has(self.podSelector)"
                        message: "egress rules need cidr or namespace/podSelector"
