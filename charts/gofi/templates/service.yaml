apiVersion: v1
kind: Service
metadata:
  name: {{ include "gofi.fullname" . }}
  labels:
    {{- include "gofi.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  allocateLoadBalancerNodePorts: {{ .Values.service.allocateLoadBalancerNodePorts }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (has .Values.service.type (list "NodePort" "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    # The AI proxy for Python libraries with AI on; worker NetworkPolicies
    # admit the controller Pods on this port only.
    - port: {{ .Values.llmProxy.port }}
      targetPort: llm
      protocol: TCP
      name: llm
  selector:
    {{- include "gofi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
