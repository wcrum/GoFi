image:
  repository: ghcr.io/wcrum/gofi
  tag: "0.2.0"
  pullPolicy: IfNotPresent
sandboxImage:
  repository: ghcr.io/wcrum/gofi-python
  tag: "0.2.0"

# Read-only cluster discovery (Cluster page, exposure and destination
# pickers, cross-namespace selector destinations). Grants get/list on Pods,
# Services, Gateways, Istio and UDS networking objects, and MetalLB pools
# cluster-wide. Disable to keep GoFi to its own namespace.
discovery:
  clusterWide: true

# Gateway exposure may add a gofi-* listener to a Gateway in another namespace.
gateway:
  manageListeners: true

# On UDS Core, keep a GoFi-managed Package (gofi-flows) with the ingress and
# egress allows each flow's exposure and destinations need.
uds:
  manageAllows: false
  # ConfigMap holding the Package base (the uds-gofi-config chart renders it).
  packageBaseConfigMap: gofi-uds-package

# NodePort range flow Services may request. Leave empty for the Kubernetes
# default (30000-32767); set it to match a cluster started with a different
# --service-node-port-range, e.g. "1-65535".
nodePortRange: ""

# Exactly one active controller; persistent resources do not provide leader election.
replicaCount: 1
service:
  type: ClusterIP
  port: 9090
  nodePort: null
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
serviceAccount:
  create: true
  name: ""
rbac:
  create: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
# Additional controller environment; chart-owned runtime variables are reserved.
env: []
# Applied independently to every listener Pod. Supply sidecar images explicitly.
# Use per-Pod ephemeral volumes for state, not a shared ReadWriteOnce claim.
listenerPodTemplate:
  containers: []
  volumes: []
  volumeMounts: []
  env: []
# Flows to declare at install time (kind Flow; see docs/flows.md): name plus
# source/framing/parser/stages/sinks. Helm owns these resources; kubectl-managed
# Flows may be applied separately.
flows: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
