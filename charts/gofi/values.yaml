image:
  repository: ghcr.io/wcrum/gofi
  tag: "0.2.0"
  pullPolicy: IfNotPresent
sandboxImage:
  repository: ghcr.io/wcrum/gofi-python
  tag: "0.2.0"

# Exactly one active controller; persistent resources do not provide leader election.
replicaCount: 1
service:
  type: ClusterIP
  port: 9090
  nodePort: null
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
serviceAccount:
  create: true
  name: ""
rbac:
  create: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
# Additional controller environment; chart-owned runtime variables are reserved.
env: []
# Applied independently to every listener Pod. Supply sidecar images explicitly.
# Use per-Pod ephemeral volumes for state, not a shared ReadWriteOnce claim.
listenerPodTemplate:
  containers: []
  volumes: []
  volumeMounts: []
  env: []
# Initial Listener definitions, with name plus source/framing/parser/stages/sinks.
# Helm owns these resources; kubectl-managed resources may be applied separately.
listeners: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
